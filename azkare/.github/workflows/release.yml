name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build matrix ────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: azkare-linux-x86_64
            install_deps: |
              sudo apt-get update -qq
              sudo apt-get install -y cmake ninja-build qt6-base-dev \
                libqt6network6-dev libqt6dbus6 libx11-dev libnotify-dev \
                libfontconfig1-dev curl
          - os: windows-latest
            artifact: azkare-windows-x86_64
            install_deps: |
              choco install cmake ninja -y --no-progress
          - os: macos-13
            artifact: azkare-macos-x86_64
            install_deps: |
              brew install cmake ninja qt6 curl
              echo "$(brew --prefix qt6)/bin" >> $GITHUB_PATH

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git hash

      - name: Install dependencies
        run: ${{ matrix.install_deps }}
        shell: bash

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_INSTALL_PREFIX=dist
        shell: bash

      - name: Build
        run: cmake --build build --parallel
        shell: bash

      - name: Install to dist/
        run: cmake --install build
        shell: bash

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf ../${{ matrix.artifact }}.tar.gz .
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a ../${{ matrix.artifact }}.zip .
          cd ..
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          tar czf ../${{ matrix.artifact }}.tar.gz .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release notes from commits
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" \
              | grep -v "^- chore(release)" || true)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD | head -20)
          fi
          VERSION=$(cat VERSION)
          {
            echo "notes<<EOF"
            echo "## أذكاري — Azkare v${VERSION}"
            echo ""
            echo "### Install / التثبيت"
            echo '```bash'
            echo "# Linux & macOS"
            echo "curl -fsSL https://raw.githubusercontent.com/arcalc/azkare/main/install.sh | bash"
            echo ""
            echo "# Windows (PowerShell)"
            echo "irm https://raw.githubusercontent.com/arcalc/azkare/main/install.ps1 | iex"
            echo '```'
            echo ""
            echo "### Changes"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Azkare ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
